name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SwiftLint runs on Linux (1x cost) via the official container.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            --entrypoint swiftlint ghcr.io/realm/swiftlint:0.62.2 lint --strict

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Only the PR→main steps (build, snapshots) need a pinned renderer; other
      # triggers run lint/coverage on the runner's default Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        with:
          xcode-version: "26.3"
      # SwiftFormat has no reliable prebuilt Linux binary, so it rides on the
      # macOS job (cheap: the job is already macOS and billed per whole minute).
      - name: SwiftFormat
        run: brew install swiftformat && swiftformat --lint .
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Modules/.build
          key: spm-${{ hashFiles('Modules/Package.resolved') }}
          restore-keys: spm-
      - name: Unit tests with coverage gate
        run: make coverage
      # The full app build is expensive on macOS; run it only on PRs into main.
      - name: Generate project
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: brew install xcodegen && xcodegen generate
      - name: Build app
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: make build SIMULATOR='iPhone 16 Pro'
      - name: View snapshots
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: make snapshot SIMULATOR='iPhone 16 Pro'
