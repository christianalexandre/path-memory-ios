name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: SwiftFormat
        run: swiftformat --lint .

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Modules/.build
          key: spm-${{ hashFiles('Modules/Package.resolved') }}
          restore-keys: spm-
      - name: Unit tests with coverage gate
        run: make coverage
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: make build SIMULATOR='iPhone 16 Pro'
