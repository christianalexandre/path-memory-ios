name: PathMemory

options:
  bundleIdPrefix: com.christianalexandre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"

# Logic and feature modules come from the local Swift package (Modules/Package.swift).
packages:
  PathMemoryKit:
    path: Modules

targets:
  # App shell: wires the live infrastructure and drives navigation.
  PathMemory:
    type: application
    platform: iOS
    sources: [App/Sources]
    settings:
      base:
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: PathMemoryKit
        product: GameFeature
      - package: PathMemoryKit
        product: MenuFeature
      - package: PathMemoryKit
        product: GRDBStorageRepository
      - package: PathMemoryKit
        product: CoreHapticsService
      - package: PathMemoryKit
        product: UIComponents
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --quiet
          else
            echo "warning: SwiftLint not installed — run 'brew bundle'"
          fi

  # Standalone hosts to iterate on a single feature.
  GameFeatureDemo:
    type: application
    platform: iOS
    sources: [Modules/Features/GameFeature/DemoApp]
    dependencies:
      - package: PathMemoryKit
        product: GameFeature

  MenuFeatureDemo:
    type: application
    platform: iOS
    sources: [Modules/Features/MenuFeature/DemoApp]
    dependencies:
      - package: PathMemoryKit
        product: MenuFeature

  PathMemoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: PathMemory
