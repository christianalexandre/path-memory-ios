name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs on Linux (1x cost) — no Xcode needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            --entrypoint swiftlint ghcr.io/realm/swiftlint:0.62.2 lint --strict
      - name: SwiftFormat
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.61.1/swiftformat_linux
          chmod +x "$RUNNER_TEMP/swiftformat"
          "$RUNNER_TEMP/swiftformat" --lint .

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Modules/.build
          key: spm-${{ hashFiles('Modules/Package.resolved') }}
          restore-keys: spm-
      - name: Unit tests with coverage gate
        run: make coverage
      # The full app build is expensive on macOS; run it only on PRs into main.
      - name: Generate project
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: brew install xcodegen && xcodegen generate
      - name: Build app
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: make build SIMULATOR='iPhone 16 Pro'
