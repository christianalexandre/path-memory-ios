pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict {staged_files}

commit-msg:
  commands:
    no-coauthor:
      run: ./scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    tests:
      run: cd Modules && xcrun swift test
